name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m factory_copilot.data.build
      - run: python -m factory_copilot.analytics.train
      - run: python -m pytest -q
      - run: python -m evaluation.cases && python -m evaluation.run --provider mock
      - uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            artifacts/analytics_metrics.json
            artifacts/eval_results_mock.json
